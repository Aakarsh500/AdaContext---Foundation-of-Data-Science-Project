[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adacontext"
version = "1.0.0"
description = "Budget-aware hybrid evidence selection for long-document question answering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FDS Project"}]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.20",
  "pyarrow>=15",
  "pypdf>=4",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "sentence-transformers>=3",
  "streamlit>=1.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
openai = ["openai>=1.40"]

[project.scripts]
adacontext = "adacontext.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

