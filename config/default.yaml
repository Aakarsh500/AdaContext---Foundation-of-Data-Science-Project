project:
  name: AdaContext
  random_seed: 42
  artifacts_dir: artifacts
  logs_dir: logs
  reports_dir: reports/generated

chunking:
  target_tokens: 220
  overlap_tokens: 40
  min_chunk_tokens: 45
  max_chunk_tokens: 330
  preserve_sections: true

retrieval:
  embedding_backend: auto
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  candidate_pool_size: 40
  rerank_pool_size: 15
  bm25_weight: 0.30
  dense_weight: 0.45
  fusion_weight: 0.15
  lexical_coverage_weight: 0.10
  rrf_constant: 60
  use_cross_encoder: false
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-6-v2

adaptive:
  simple_budget: 2
  moderate_budget: 5
  complex_budget: 8
  maximum_budget: 10
  mmr_relevance_weight: 0.72
  neighbour_bonus: 0.06
  low_confidence_threshold: 0.42
  enable_confidence_expansion: true
  budget_model_path: artifacts/budget_controller.joblib

generation:
  provider: extractive
  max_context_tokens: 4000
  max_answer_sentences: 4
  temperature: 0.0
  ollama_base_url: http://localhost:11434
  ollama_model: llama3.2:3b
  compatible_base_url: http://localhost:1234/v1
  compatible_model: local-model

evaluation:
  fixed_k: 3
  evidence_match_threshold: 0.55
  bootstrap_samples: 500
  strategies:
    - full_context
    - bm25_fixed
    - dense_fixed
    - hybrid_fixed
    - elbow
    - adaptive
